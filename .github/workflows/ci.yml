name: VisaIQ CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @visaiq/backend test
      - run: pnpm --filter @visaiq/backend build
      - run: pnpm --filter @visaiq/web build
      - run: pnpm --filter @visaiq/web exec playwright install --with-deps chromium
      - run: pnpm --filter @visaiq/web test:smoke
