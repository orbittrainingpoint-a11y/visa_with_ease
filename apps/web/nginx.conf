server {
    # Container runs with network_mode: host (see docker-compose.yml — needed
    # for outbound DNS to work at all on this VPS), so this is the literal
    # host port, not an internal one behind a published port mapping. Picked
    # to avoid colliding with other services already on this host's port 80.
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real static assets — cache aggressively, filenames are content-hashed by Vite.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router owns every other path client-side.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
