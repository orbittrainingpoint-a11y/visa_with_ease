server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real static assets — cache aggressively, filenames are content-hashed by Vite.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router owns every other path client-side.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
