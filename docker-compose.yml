services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - apps/backend/.env.production
    ports:
      - "3001:3001"
    volumes:
      # Only needed if using a Firebase service-account JSON file instead of
      # Application Default Credentials — see apps/backend/.env.production.example.
      - ./apps/backend/firebase-service-account.json:/app/firebase-service-account.json:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the JS bundle at build time — must be the PUBLIC URL
        # your browser will reach the backend at (through your reverse proxy),
        # not the internal container address.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_WEB_CLIENT_ID: ${VITE_GOOGLE_WEB_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

# Nothing here terminates TLS or owns a domain — put your own nginx/Caddy
# reverse proxy in front of ports 3001 (backend) and 8080 (web), pointed at
# your real domain, and let it handle Let's Encrypt certificates. See DEPLOY.md.
