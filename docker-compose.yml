services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      # Build-time RUN steps (corepack/pnpm install) need real DNS resolution.
      # Some hosts block outbound DNS from Docker's isolated bridge network
      # even though the host itself resolves fine — host networking during
      # the build sidesteps that without touching the host's firewall/DNS.
      network: host
    restart: unless-stopped
    # Some VPS hosts block outbound DNS from Docker's isolated bridge network
    # entirely (both build-time AND runtime) even though the host itself
    # resolves fine — without this, Firestore/Gemini/SMTP/Google token
    # verification all silently fail to resolve and the app degrades to
    # in-memory storage with no visible error. Host networking sidesteps it.
    # Means PORT in .env.production IS the literal host port — no more
    # separate host:container port mapping (see .env.production.example).
    network_mode: host
    env_file:
      - apps/backend/.env.production
    volumes:
      # Only needed if using a Firebase service-account JSON file instead of
      # Application Default Credentials — see apps/backend/.env.production.example.
      - ./apps/backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      network: host
      args:
        # Baked into the JS bundle at build time — must be the PUBLIC URL
        # your browser will reach the backend at (through your reverse proxy),
        # not the internal container address.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_WEB_CLIENT_ID: ${VITE_GOOGLE_WEB_CLIENT_ID}
    restart: unless-stopped
    # Same reason as backend's network_mode: host above — see that comment.
    # nginx.conf listens on 8081 directly now, not the usual 80.
    network_mode: host
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 32M

# Nothing here terminates TLS or owns a domain — put your own nginx/Caddy
# reverse proxy in front of ports 3011 (backend) and 8081 (web), pointed at
# your real domain, and let it handle Let's Encrypt certificates. See DEPLOY.md.
#
# Both services use network_mode: host instead of published ports/an internal
# Docker network — see the comment on backend's network_mode line for why.
