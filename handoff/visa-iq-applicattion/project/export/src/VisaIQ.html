// Wrapper to render a Web (DOM-shell) screen inside a fixed-size browser frame
function WebFrame({ width = 1280, height = 800, url, tab, children }) {
  return (
    <VBrowser width={width} height={height} url={url} tab={tab}>{children}</VBrowser>
  );
}

// Single artboard helper for phone screens
function PhoneArt({ children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', height: '100%' }}>
      <VPhone width={380} height={800}>{children}</VPhone>
    </div>
  );
}

// DS artboard helper (just renders content full-size with white bg)

  return <div style={{ width: '100%', height: '100%', background: '#fff' }}>{children}</div>;
