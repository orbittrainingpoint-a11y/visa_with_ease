<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1400"/>
<title>VisaIQ — Design System & Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
  html, body, #root { height: 100%; }

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- foundation -->
<script type="text/babel" src="components/design-canvas.jsx"></script>
<script type="text/babel" src="components/viq-frames.jsx"></script>
<script type="text/babel" src="components/viq-ui.jsx"></script>

<!-- screens -->
<script type="text/babel" src="screens/system.jsx"></script>
<script type="text/babel" src="screens/mobile-auth.jsx"></script>
<script type="text/babel" src="screens/mobile-consumer.jsx"></script>
<script type="text/babel" src="screens/mobile-b2b.jsx"></script>
<script type="text/babel" src="screens/mobile-profile.jsx"></script>
<script type="text/babel" src="screens/mobile-agent.jsx"></script>
<script type="text/babel" src="screens/web-screens.jsx"></script>
<script type="text/babel" src="screens/web-agent-hr.jsx"></script>
<script type="text/babel" src="screens/realtime-analysis.jsx"></script>
<script type="text/babel" src="screens/mobile-extras.jsx"></script>
<script type="text/babel" src="screens/dashboards-extra.jsx"></script>

<script type="text/babel">
const { useState } = React;

// Wrapper to render a Web (DOM-shell) screen inside a fixed-size browser frame
function WebFrame({ width = 1280, height = 800, url, tab, children }) {
  return (
    <VBrowser width={width} height={height} url={url} tab={tab}>{children}</VBrowser>
  );
}

// Single artboard helper for phone screens
function PhoneArt({ children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', height: '100%' }}>
      <VPhone width={380} height={800}>{children}</VPhone>
    </div>
  );
}

// DS artboard helper (just renders content full-size with white bg)
function DSArt({ children }) {
  return <div style={{ width: '100%', height: '100%', background: '#fff' }}>{children}</div>;
}

function App() {
  return (
    <DesignCanvas>
      {/* ═══════════════ INTRO ═══════════════ */}
      <DCSection id="cover" title="VisaIQ · Design System & Prototype Board" subtitle="Full UI system + Web app + Android mobile app · All user roles">
        <DCArtboard id="cover" label="Overview" width={1100} height={620}>
          <div style={{ width: '100%', height: '100%', background: 'linear-gradient(135deg, #0B1F4B 0%, #1A56DB 60%, #7C3AED 100%)', color: '#fff', padding: 56, position: 'relative', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
            <div style={{ position: 'absolute', right: -100, top: -100, width: 480, height: 480, borderRadius: '50%', background: 'radial-gradient(circle, rgba(14,165,233,.3), transparent 65%)' }}/>
            <div style={{ position: 'absolute', right: 100, bottom: -120, width: 360, height: 360, borderRadius: '50%', background: 'radial-gradient(circle, rgba(245,158,11,.25), transparent 65%)' }}/>
            <div style={{ position: 'relative' }}>
              <Logo size={36} onDark/>
              <div style={{ font: '500 12px/1 Inter', color: '#0EA5E9', letterSpacing: 2, textTransform: 'uppercase', marginTop: 36 }}>Design System · v2.0</div>
              <div style={{ font: '800 64px/1.05 Plus Jakarta Sans', marginTop: 14, letterSpacing: '-0.03em', maxWidth: 740 }}>
                AI-powered visa intelligence —<br/>
                <span style={{ color: '#F59E0B' }}>simplified for everyone.</span>
              </div>
              <div style={{ font: '400 17px/1.5 Inter', color: 'rgba(255,255,255,.75)', marginTop: 22, maxWidth: 620 }}>
                A full design language and frame-by-frame prototype board for VisaIQ — covering Tourist, Professional, HR Manager and Admin users across Android + Web.
              </div>
            </div>
            <div style={{ marginTop: 'auto', position: 'relative', display: 'flex', gap: 40 }}>
              {[
                { v: '50+', l: 'Frame specifications' },
                { v: '4', l: 'User roles' },
                { v: '2', l: 'Platforms · Web + Android' },
                { v: '94%', l: 'AI audit accuracy' },
              ].map((s, i) => (
                <div key={i}>
                  <div style={{ font: '800 36px/1 Plus Jakarta Sans', color: '#fff' }}>{s.v}</div>
                  <div style={{ font: '500 12px/1.3 Inter', color: 'rgba(255,255,255,.6)', marginTop: 6, letterSpacing: 0.4 }}>{s.l}</div>
                </div>
              ))}
            </div>
          </div>
        </DCArtboard>
      </DCSection>

      {/* ═══════════════ DESIGN SYSTEM ═══════════════ */}
      <DCSection id="system" title="01 · Design System" subtitle="Tokens, type, spacing, components — the foundation everything else uses">
        <DCArtboard id="colors" label="Color tokens" width={720} height={760}><DSArt><DSColors/></DSArt></DCArtboard>
        <DCArtboard id="type" label="Typography" width={720} height={760}><DSArt><DSType/></DSArt></DCArtboard>
        <DCArtboard id="space" label="Spacing · Radius · Elevation" width={720} height={760}><DSArt><DSSpacing/></DSArt></DCArtboard>
        <DCArtboard id="btns" label="Buttons" width={720} height={620}><DSArt><DSButtons/></DSArt></DCArtboard>
        <DCArtboard id="inputs" label="Forms · Inputs · Upload" width={920} height={760}><DSArt><DSInputs/></DSArt></DCArtboard>
        <DCArtboard id="cards" label="Cards · Score rings" width={920} height={620}><DSArt><DSCards/></DSArt></DCArtboard>

        <DCArtboard id="register" label="F-AUTH-REG-01 · Register" width={400} height={820}><PhoneArt><MRegister/></PhoneArt></DCArtboard>
        <DCArtboard id="verify" label="F-AUTH-VERIFY-01 · Verify email" width={400} height={820}><PhoneArt><MVerify/></PhoneArt></DCArtboard>
        <DCArtboard id="login" label="F-AUTH-LOGIN-01 · Login" width={400} height={820}><PhoneArt><MLogin/></PhoneArt></DCArtboard>
        <DCArtboard id="onb1" label="F-ONBOARD-01 · Nationality" width={400} height={820}><PhoneArt><MOnboard1/></PhoneArt></DCArtboard>
        <DCArtboard id="onb2" label="F-ONBOARD-02 · Destination" width={400} height={820}><PhoneArt><MOnboard2/></PhoneArt></DCArtboard>
        <DCArtboard id="onb4" label="F-ONBOARD-04 · You're ready" width={400} height={820}><PhoneArt><MOnboard4/></PhoneArt></DCArtboard>

      {/* ═══════════════ MOBILE — CONSUMER ═══════════════ */}

        <DCArtboard id="appdetail" label="F-APP-DETAIL-01 · Application · Documents tab" width={400} height={820}><PhoneArt><MAppDetail/></PhoneArt></DCArtboard>
        <DCArtboard id="upload" label="F-DOC-UPLOAD-01 · Upload sheet" width={400} height={820}><PhoneArt><MDocUpload/></PhoneArt></DCArtboard>
        <DCArtboard id="audit" label="F-AUDIT-REPORT-01 · AI Audit Report" width={400} height={820}><PhoneArt><MAuditReport/></PhoneArt></DCArtboard>
        <DCArtboard id="req" label="F-REQ-01 · Live Requirements" width={400} height={820}><PhoneArt><MRequirements/></PhoneArt></DCArtboard>
        <DCArtboard id="chat" label="F-CHAT-01 · AI Assistant" width={400} height={820}><PhoneArt><MChat/></PhoneArt></DCArtboard>
        <DCArtboard id="booking" label="F-BOOKING-01 · VIP Expert booking" width={400} height={820}><PhoneArt><MBooking/></PhoneArt></DCArtboard>
        <DCArtboard id="checkout" label="F-CHECKOUT · Payment" width={400} height={820}><PhoneArt><MCheckout/></PhoneArt></DCArtboard>

        <DCArtboard id="search" label="F-SEARCH · Global search + AI answer" width={400} height={820}><PhoneArt><MSearch/></PhoneArt></DCArtboard>
        <DCArtboard id="empty" label="F-EMPTY · No applications yet" width={400} height={820}><PhoneArt><MEmptyApps/></PhoneArt></DCArtboard>
        <DCArtboard id="offline" label="F-OFFLINE · Offline / cached mode" width={400} height={820}><PhoneArt><MOffline/></PhoneArt></DCArtboard>
        <DCArtboard id="dark" label="F-DASH-DARK · Dashboard — dark theme" width={400} height={820}><PhoneArt><MDashboardDark/></PhoneArt></DCArtboard>
      </DCSection>

      {/* ═══════════════ MOBILE — PROFILE & APPLICATIONS ═══════════════ */}

        <DCArtboard id="prof-travel" label="F-PROFILE-TRAVEL · Travel history" width={400} height={820}><PhoneArt><MProfileTravel/></PhoneArt></DCArtboard>
        <DCArtboard id="prof-fin" label="F-PROFILE-FIN · Bank statements (3 mo)" width={400} height={820}><PhoneArt><MProfileFinancials/></PhoneArt></DCArtboard>

        <DCArtboard id="m-clearance" label="F-CLEARANCE-01 · Document clearance / session" width={400} height={820}><PhoneArt><MDocClearance/></PhoneArt></DCArtboard>
        <DCArtboard id="m-consult" label="F-CONSULT-01 · Find consultant (live)" width={400} height={820}><PhoneArt><MFindConsultant/></PhoneArt></DCArtboard>
        <DCArtboard id="m-agentchat" label="F-AGENTCHAT-01 · Chat with consultant" width={400} height={820}><PhoneArt><MAgentChat/></PhoneArt></DCArtboard>
      </DCSection>

      {/* ═══════════════ MOBILE — B2B ═══════════════ */}

      </DCSection>

      {/* ═══════════════ MOBILE — B2B Employee ═══════════════ */}

        <DCArtboard id="emp" label="F-EMP · Employee dashboard" width={400} height={820}><PhoneArt><MEmployee/></PhoneArt></DCArtboard>
      </DCSection>
      <DCSection id="mobile-agent" title="07 · Mobile Android — Agent / Consultant app" subtitle="The other side of the marketplace — incoming queue, document review, earnings">
        <DCArtboard id="a-queue" label="F-AGENT-QUEUE · Today's queue" width={400} height={820}><PhoneArt><AgentQueue/></PhoneArt></DCArtboard>
        <DCArtboard id="a-review" label="F-AGENT-REVIEW · Application review" width={400} height={820}><PhoneArt><AgentReview/></PhoneArt></DCArtboard>
        <DCArtboard id="a-earn" label="F-AGENT-EARN · Earnings" width={400} height={820}><PhoneArt><AgentEarnings/></PhoneArt></DCArtboard>
      </DCSection>

      {/* ═══════════════ WEB — CONSUMER ═══════════════ */}

        <DCArtboard id="w-dash" label="Consumer dashboard" width={1300} height={820}>
          <WebFrame width={1280} height={800} url="visaiq.app/dashboard" tab="VisaIQ · Dashboard"><WConsumerDashboard/></WebFrame>

        <DCArtboard id="w-app" label="Application detail · Documents" width={1300} height={820}>

      {/* ═══════════════ WEB — B2B ═══════════════ */}

          <WebFrame width={1280} height={800} url="visaiq.app/team/maria-santos" tab="Maria Santos · VisaIQ"><WB2BEmployee/></WebFrame>
        </DCArtboard>
        <DCArtboard id="w-b2b-rep" label="HR · Reports & Compliance" width={1300} height={820}>
          <WebFrame width={1280} height={800} url="visaiq.app/reports" tab="Reports · VisaIQ"><WB2BReports/></WebFrame>

      {/* ═══════════════ WEB — AGENT ═══════════════ */}

        </DCArtboard>
        <DCArtboard id="w-agent-r" label="Agent · Application review" width={1300} height={820}>
          <WebFrame width={1280} height={800} url="agent.visaiq.app/review/de-2026-q" tab="Review · Agent Console"><WAgentReview/></WebFrame>
        </DCArtboard>
        <DCArtboard id="w-agent-e" label="Agent · Earnings & reviews" width={1300} height={820}>
          <WebFrame width={1280} height={800} url="agent.visaiq.app/earnings" tab="Earnings · Agent Console"><WAgentEarnings/></WebFrame>
        </DCArtboard>
      </DCSection>

      {/* ═══════════════ WEB — ADMIN ═══════════════ */}
      <DCSection id="web-admin" title="11 · Web — Platform Admin" subtitle="Platform KPIs, user management, AI monitoring, revenue, requirements DB, super-admin">
        <DCArtboard id="w-admin-dash" label="Admin · Overview" width={1300} height={820}>
          <WebFrame width={1280} height={800} url="visaiq.app/admin" tab="VisaIQ · Admin"><WAdminDashboard/></WebFrame>
        </DCArtboard>
        <DCArtboard id="w-admin-ai" label="Admin · AI monitoring" width={1300} height={820}>
          <WebFrame width={1280} height={800} url="visaiq.app/admin/ai" tab="AI Monitor · VisaIQ"><WAdminAI/></WebFrame>
        </DCArtboard>
        <DCArtboard id="w-admin-users" label="Admin · User management" width={1300} height={820}>
          <WebFrame width={1280} height={800} url="visaiq.app/admin/users" tab="Users · VisaIQ Admin"><WAdminUsers/></WebFrame>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
